[project]
name = "alter-domain"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic-settings>=2.11", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "httpx>=0.28"]

[project.scripts]
alter-invitations = "alter_domain.cli.invitations:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
