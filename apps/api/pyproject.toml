[project]
name = "alter-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["alter-domain", "fastapi>=0.120", "uvicorn[standard]>=0.38", "pyjwt[crypto]>=2.10", "httpx>=0.28"]

[project.scripts]
alter-api = "alter_api.main:main"
alter-api-purge = "alter_api.purge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
