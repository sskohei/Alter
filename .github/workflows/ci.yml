name: CI

on:
  pull_request:
    branches: [main, feature/8-api-client-mock, feature/9-ssr-auth-layout, feature/17-agent-creation-editor, feature/23-conversation-notification-ui, feature/24-interaction-settings-ui]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALTER_MODE: mock
  DISCORD_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --all-packages mypy
      - run: uv run --all-packages pytest

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm api:generate
      - name: Reject stale OpenAPI and TypeScript schema
        run: |
          git ls-files --error-unmatch -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts packages/api-client/preview.openapi.json packages/api-client/src/preview-schema.d.ts > /dev/null
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts packages/api-client/preview.openapi.json packages/api-client/src/preview-schema.d.ts

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DB only: Supabase's roles/auth schema exist; no API keys are printed.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db reset --local --no-seed
      - run: pnpm exec supabase db lint --local --schema public --fail-on error
            # pgTAP: RLS default deny, FK/UNIQUE/CHECK, delete cascade (supabase/tests/*.sql)
      - run: pnpm exec supabase test db --local
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --all-packages --locked
      # Python DB integration tests (tests/db): concurrent 10-seat cap, atomic revoke, audit content.
      # Disposable local DB only: the tests empty the invitation tables.
      - run: uv run --all-packages pytest tests/db
        env:
          ALTER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
          ALTER_REQUIRE_DB_TESTS: "1"
      - name: Explain the current migration coverage
        run: |
          if ! find supabase/migrations -name '*.sql' -print -quit | grep -q .; then
            echo 'No application SQL yet. The empty Supabase reset/lint gate is active; add RLS/FK/UNIQUE tests with the first schema PR.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop the disposable database
        if: always()
        run: pnpm exec supabase stop --no-backup

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history without exposing matches
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'

  required:
    name: CI required
    if: always()
    needs: [python, web, api-contract, migrations, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every quality gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
